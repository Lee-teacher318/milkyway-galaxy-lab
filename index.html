<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0d16">
<meta name="mobile-web-app-capable" content="yes">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>우리은하 탐험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 관측 일지 같은 밤하늘 작업대: 왼쪽 은하 모형, 오른쪽 관측자의 전천 지도, 아래 조작판과 탐구 카드 */
:root{
  --bg:#0a0d16; --panel:#10141f; --panel-2:#161b2a; --line:#262d42;
  --fg:#e7e9f1; --muted:#98a0b8; --sun:#f3bd55; --ray:#8db8ff; --rose:#ec8ea4;
  --f-display:"Gowun Batang", "Nanum Myeongjo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;flex-direction:column;gap:6px;padding-block:8px 4px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--sun);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.4vw,42px);line-height:1.2;margin:0;text-wrap:balance}
.lede{color:var(--muted);max-width:68ch;margin:0}
h2{font-family:var(--f-display);font-size:19px;margin:0;font-weight:700}
h3{font-size:16px;margin:0;font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
#galWrap{max-width:max(300px, min(640px, calc(100svh - 200px)));margin-inline:auto}
.sky-panel{grid-column:1/-1}
@media (max-width:920px){.lab{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);border-radius:0}
.seg button:last-child{border-right:0}
button{font-family:var(--f-body);font-size:13.5px;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer}
button:hover{background:#1d2335}
button[aria-pressed="true"]{background:var(--sun);color:#1a1405;font-weight:600}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ray);outline-offset:2px}
.canvas-wrap{position:relative;width:100%;border-radius:8px;overflow:hidden;background:#05070d}
.canvas-wrap.sq{aspect-ratio:1/1;max-width:100%}
.canvas-wrap.wide{max-width:100%;background:#03040b;cursor:grab;height:max(300px, min(56.25vw, calc(100svh - 200px)))}
@media (orientation:portrait){.canvas-wrap.wide{height:max(300px, min(80vw, calc(100svh - 260px)))}}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px;pointer-events:none}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (pointer:coarse){
  button{min-height:44px;padding:9px 15px;font-size:15px}
  .seg button{min-width:48px}
  .hint{font-size:14px}
  .ruler-out{font-size:16px}
  .legend{font-size:14px;gap:8px 16px}
  .dot{width:12px;height:12px}
}
@media (max-height:860px) and (orientation:landscape){
  body{padding-block:10px 24px}
  header.top{padding-block:0;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
  .eyebrow{display:none}
  h1{font-size:26px}
  .lede{font-size:13.5px;max-width:none;flex:1 1 400px}
  .wrap{gap:12px}
  .panel{padding:12px;gap:10px}
}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.space-btn{background:var(--ray);color:#07122a;font-weight:600;border-color:transparent}
.space-btn:hover{background:#a9caff}
.trip{position:fixed;inset:0;z-index:50;background:#03040a;transition:opacity .5s}
.trip.out{opacity:0}
.trip canvas{position:absolute;inset:0;width:100%;height:100%}
.trip-cap{position:absolute;left:max(24px, env(safe-area-inset-left, 0px));bottom:calc(28px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:4px;max-width:min(560px, calc(100% - 48px))}
.trip-title{font-family:var(--f-display);font-size:clamp(28px,5vw,44px);font-weight:700;color:var(--fg)}
.trip-sub{color:var(--muted);font-size:15px}
.trip-scale{font-family:var(--f-mono);color:var(--sun);font-size:14px}
.trip-skip{position:absolute;top:calc(16px + env(safe-area-inset-top, 0px));right:max(16px, env(safe-area-inset-right, 0px))}
.ruler-out{margin:0;text-align:center;font-size:14.5px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.ruler-out.gaze-out b{color:#8db8ff;font-family:var(--f-body);font-weight:600}
.ruler-out.gaze-out .muted{color:var(--muted);font-size:12.5px}
.ruler-out b{font-family:var(--f-mono);color:#5fe0c0;font-weight:500}
#measureBtn[aria-pressed="true"]{background:#5fe0c0;color:#05211a}
#galWrap.measuring canvas{cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.stat .v b{color:var(--sun);font-weight:500}
.profiles{display:grid;grid-template-columns:1fr;gap:10px}
@media (max-width:560px){.profiles{grid-template-columns:1fr}}
.skytime{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.skytime>.field{flex:1 1 200px;min-width:0}
.skytime>.presets,.skytime>#domeView,.skytime>.check{flex:0 0 auto}
.seg button{white-space:nowrap}
[hidden]{display:none!important}
button:disabled{opacity:.4;cursor:not-allowed}
.prof{display:flex;flex-direction:column;gap:4px;min-width:0}
.prof .k{font-size:12px;color:var(--muted)}
.prof .cw{height:120px;background:#05070d;border-radius:6px;overflow:hidden}
.controls{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.controls{grid-template-columns:minmax(0,1fr)}}
.group{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field .row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.field output{font-family:var(--f-mono);color:var(--sun);font-variant-numeric:tabular-nums}
.field small{color:var(--muted);font-size:12px}
input[type=range]{width:100%;accent-color:var(--sun)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px}
.check input{width:18px;height:18px;accent-color:var(--sun)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card .q{font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.35}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .acts{display:flex;flex-wrap:wrap;gap:6px}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-size:13.5px;color:var(--ray)}
details p{color:var(--fg);margin-top:6px}
.why{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.why{grid-template-columns:minmax(0,1fr)}}
.why ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.why li::marker{font-family:var(--f-mono);color:var(--sun)}
.note{font-size:12.5px;color:var(--muted);margin:0;max-width:90ch}
.mono{font-family:var(--f-mono)}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="eyebrow">별과 우주 · 우리은하</span>
    <h1>우리은하 탐험실</h1>
    <p class="lede">여름밤 들판에 서서 하늘 돔을 올려다보며 은하수를 찾아보세요. 하늘을 둘러본 뒤 <b>우주로 나가기</b>를 누르면 지구와 태양계를 떠나 우리은하 전체를 내려다볼 수 있습니다.</p>
  </header>

  <main class="lab">
    <section class="panel sky-panel" aria-label="관측자가 보는 하늘">
      <div class="panel-head">
        <h2>관측자가 보는 밤하늘</h2>
        <div class="presets">
          <button id="spaceBtn" class="space-btn" aria-pressed="false">우주로 나가기</button>
          <button id="lookCenter">은하 중심 쪽 보기</button>
          <button id="lookUp">머리 위 보기</button>
          <div class="seg" role="group" aria-label="시야"><button id="zOut" aria-label="넓게 보기">−</button><button id="zIn" aria-label="좁게 보기">+</button></div>
          <button id="names" aria-pressed="true">별자리 이름</button>
          <button id="clearPin">시선 지우기</button>
          <button id="fsBtn">전체 화면</button>
        </div>
      </div>
      <div class="canvas-wrap wide" id="skyWrap"><canvas id="sky" aria-label="돔 안의 관측자가 바라본 밤하늘"></canvas><div class="loading" id="skyLoading">밤하늘을 준비하는 중…</div></div>
      <p class="ruler-out gaze-out" id="gazeOut"></p>
      <p class="hint" id="skyHint"></p>
    </section>
    <section class="panel" aria-label="우리은하 모형" id="galPanel" hidden>
      <div class="panel-head">
        <h2>우리은하 모형</h2>
        <div class="presets"><button id="measureBtn" aria-pressed="false">거리 재기</button><button id="clearRuler">자 지우기</button>
        <div class="seg" role="group" aria-label="모형을 보는 방향">
          <button id="vTop" aria-pressed="true">위에서</button>
          <button id="vTilt" aria-pressed="false">비스듬히</button>
          <button id="vSide" aria-pressed="false">옆에서</button>
        </div></div>
      </div>
      <div class="canvas-wrap sq" id="galWrap"><canvas id="gal" aria-label="우리은하 3차원 모형"></canvas></div>
      <p class="ruler-out" id="rulerOut"></p>
      <p class="hint">끌어서 돌려 보세요. 관측자는 태양계에 있습니다. 거리 재기를 켜면 끌어서 거리를 잽니다.</p>
      <ul class="legend">
        <li><span class="dot" style="background:#ffd59a"></span>팽대부·막대 (늙은 별)</li>
        <li><span class="dot" style="background:#cdd7ff"></span>원반의 별</li>
        <li><span class="dot" style="background:#7fb4ff"></span>나선팔의 젊은 별</li>
        <li><span class="dot" style="background:#3a2a2e;border:1px solid #6a5258"></span>성간 먼지</li>
        <li><span class="dot" style="background:var(--sun)"></span>태양계</li>
        <li><span class="dot" style="background:var(--ray)"></span>관측자·시선</li>
        <li><span class="dot" style="background:#7ff0ff"></span>시선이 지나는 별 무리</li>
      </ul>
    </section>

  </main>
  <div class="trip" id="trip" hidden>
    <canvas id="tripCv"></canvas>
    <div class="trip-cap"><span class="trip-title" id="tripTitle">지구</span><span class="trip-sub" id="tripSub"></span><span class="trip-scale" id="tripScale"></span></div>
    <button id="tripSkip" class="trip-skip">건너뛰기</button>
  </div>
</div>

<script>
(()=>{
const DEG=Math.PI/180, TAU=Math.PI*2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(20261026);
const gauss=()=>{let u=0;while(u===0)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*rnd())};
const laplace=()=>{const u=rnd()-0.5;return -Math.sign(u)*Math.log(1-2*Math.abs(u)+1e-12)};
const sampR=(h,a,b)=>{let r;do{r=-h*Math.log(rnd()*rnd()+1e-12)}while(r<a||r>b);return r};

/* ---------- 은하 모형 만들기 ---------- */
const K=Math.tan(12*DEG), R0=3800, PHI0=188*DEG, BAR=153*DEG;
const armTheta=(a,r)=>PHI0+a*Math.PI/2+Math.log(r/R0)/K;
const armPick=()=>[0,0,1,2,2,3][Math.floor(rnd()*6)];
const S={x:[],y:[],zb:[],sc:[],L:[],w:[],g:[]};
function push(x,y,zb,sc,L,w,g){S.x.push(x);S.y.push(y);S.zb.push(zb);S.sc.push(sc);S.L.push(L);S.w.push(w);S.g.push(g)}
// 원반의 별
for(let i=0;i<14000;i++){let r=sampR(2800,800,15000);while(r<4000&&rnd()<0.75)r=sampR(2800,800,15000);const on=r>3400&&rnd()<0.55;
  const th=on?armTheta(armPick(),r)+gauss()*(700/r):rnd()*TAU;
  push(r*Math.cos(th)+gauss()*60,r*Math.sin(th)+gauss()*60,laplace()*300,1,0.6,0.3,0)}
// 나선팔의 젊은 별
for(let i=0;i<3000;i++){const r=sampR(4000,3600,15000);const th=armTheta(armPick(),r)+gauss()*(380/r);
  const pink=rnd()<0.12;push(r*Math.cos(th),r*Math.sin(th),laplace()*80,1,pink?0.8:1.2,0,pink?4:1)}
// 막대
for(let i=0;i<4600;i++){let s=2*rnd()-1;s=Math.sign(s)*Math.pow(Math.abs(s),0.85)*3900;const p=gauss()*420*(1-0.45*Math.abs(s)/3900);
  push(s*Math.cos(BAR)-p*Math.sin(BAR),s*Math.sin(BAR)+p*Math.cos(BAR),gauss()*330,0,0.85,1,2)}
// 팽대부
for(let i=0;i<1100;i++)push(gauss()*600,gauss()*600,gauss()*480,0,0.95,1,2);
// 오리온 팔(국부 팔): 태양계가 놓인 나선팔
for(let i=0;i<1000;i++){const r=6000+rnd()*6000,th=Math.PI+Math.log(r/8500)/K+gauss()*(420/r);push(r*Math.cos(th),r*Math.sin(th),laplace()*280,1,0.6,0.3,0)}
for(let i=0;i<320;i++){const r=6200+rnd()*5600,th=Math.PI+Math.log(r/8500)/K+gauss()*(300/r);const pink=rnd()<0.12;push(r*Math.cos(th),r*Math.sin(th),laplace()*80,1,pink?0.8:1.2,0,pink?4:1)}
// 헤일로
for(let i=0;i<700;i++){const r=Math.min(30000,2500*Math.pow(rnd(),-0.55));const u=2*rnd()-1,ph=rnd()*TAU,q=Math.sqrt(1-u*u);
  push(r*q*Math.cos(ph),r*q*Math.sin(ph),r*u,0,0.6,0.6,3)}
const N=S.x.length;const PSIZE=[480,320,750,3500,320];
const X=Float32Array.from(S.x),Y=Float32Array.from(S.y),ZB=Float32Array.from(S.zb),SC=Uint8Array.from(S.sc),
      LUM=Float32Array.from(S.L),WARM=Float32Array.from(S.w),GRP=Uint8Array.from(S.g);
// 먼지 구름
const Cx=[],Cy=[],Czb=[],Csc=[],Cr=[],Ct=[];
function cloud(x,y,zb,sc,r,t){Cx.push(x);Cy.push(y);Czb.push(zb);Csc.push(sc);Cr.push(r);Ct.push(t)}
for(let i=0;i<420;i++){const r=sampR(3500,2500,14500);const th=armTheta(armPick(),r)+gauss()*(300/r);
  cloud(r*Math.cos(th),r*Math.sin(th),gauss()*55,1,130+rnd()*220,0.8+rnd()*1.6)}
for(let i=0;i<40;i++)cloud(gauss()*500,gauss()*500,gauss()*40,1,150,2);
for(let i=0;i<9;i++){const l=(5+rnd()*50)*DEG,d=250+rnd()*350;cloud(-8500+d*Math.cos(l),d*Math.sin(l),20+gauss()*12,0,90+rnd()*50,1.1)}
for(let i=0;i<60;i++){const a=rnd()*TAU,d=400+rnd()*1600;cloud(-8500+d*Math.cos(a),d*Math.sin(a),gauss()*35,0,70+rnd()*90,0.3+rnd()*0.6)}
const NC=Cx.length;
// 가까운 밝은 별(장식): 관측자 기준 방향
const NEAR=[];for(let i=0;i<650;i++){const u=2*rnd()-1,ph=rnd()*TAU,q=Math.sqrt(1-u*u);NEAR.push([q*Math.cos(ph),q*Math.sin(ph),u,Math.pow(rnd(),3)])}

/* ---------- 상태 ---------- */
const st={R:8500,az:180,s:5,t:0,dust:true,near:true,yaw:0,tilt:0,lc:0,bc:0,hover:null,pin:null};
const sToZ=s=>Math.sign(s)*30000*Math.pow(Math.abs(s)/100,2.5);
const zToS=z=>Math.round(Math.sign(z)*100*Math.pow(Math.min(1,Math.abs(z)/30000),0.4));
const tToF=t=>Math.exp(Math.log(30)*t/100);
const obs=()=>({x:st.R*Math.cos(st.az*DEG),y:st.R*Math.sin(st.az*DEG),z:sToZ(st.s)});
const fmt=n=>Math.round(n).toLocaleString('ko-KR').replace(/,/g,' ');
const sunPos={x:-8500,y:0,z:20};

/* ---------- 하늘 계산 ---------- */
const DX=new Float32Array(N),DY=new Float32Array(N),DZ=new Float32Array(N),BR=new Float32Array(N),ANG=new Float32Array(N);
let U=[1,0],V=[0,1];
const bP=new Float64Array(181),lP=new Float64Array(72);
let bandRatio=0,centerRatio=0;
function computeSky(){
  const O=obs(),f=tToF(st.t);
  const Rxy=Math.hypot(O.x,O.y);
  U=Rxy<50?[1,0]:[-O.x/Rxy,-O.y/Rxy];V=[-U[1],U[0]];
  const hd=110*f;
  const G=z=>Math.sign(z)*hd*(1-Math.exp(-Math.abs(z)/hd));
  const G0=G(O.z);
  const wx=new Float32Array(NC),wy=new Float32Array(NC),wz=new Float32Array(NC),w2=new Float32Array(NC),r2=new Float32Array(NC);
  for(let c=0;c<NC;c++){wx[c]=Cx[c]-O.x;wy[c]=Cy[c]-O.y;wz[c]=(Csc[c]?Czb[c]*f:Czb[c])-O.z;w2[c]=wx[c]*wx[c]+wy[c]*wy[c]+wz[c]*wz[c];r2[c]=Cr[c]*Cr[c]}
  bP.fill(0);lP.fill(0);
  for(let i=0;i<N;i++){
    const sz=SC[i]?ZB[i]*f:ZB[i];
    const dx=X[i]-O.x,dy=Y[i]-O.y,dz=sz-O.z;const d2=dx*dx+dy*dy+dz*dz,d=Math.sqrt(d2);
    if(d<1){BR[i]=0;continue}

  const sm=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
  const fade=(L,a,b,c,d)=>sm(a,b,L)*(1-sm(c,d,L));
  function widthText(w){if(w<0.01*AU)return`약 ${fmt(w/KM)} km`;if(w<0.02)return`약 ${(w/AU).toLocaleString('ko-KR',{maximumSignificantDigits:2})} AU`;return`약 ${w<10?(w).toLocaleString('ko-KR',{maximumSignificantDigits:2}):fmt(w)} pc`}
  function frame(now){const u=Math.min(1,(now-t0)/DUR);const L=Lat(now-t0);
    const hw=Math.pow(10,L),sc=(W/2)/hw;
    const k1=sm(-8.6,-6.2,L),k2=sm(2.3,3.9,L);
    const cx=EARTH[0]+(SUN[0]-EARTH[0])*k1+(0-SUN[0])*k2,cy=0;
    const P=(x,y)=>[W/2+(x-cx)*sc,H/2-(y-cy)*sc];
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.globalCompositeOperation='source-over';ctx.fillStyle='#03040a';ctx.fillRect(0,0,W,H);
    for(const[a,b,c]of BG){ctx.fillStyle=`rgba(220,226,255,${0.15+c*0.35})`;ctx.fillRect(a*W,b*H,c>0.9?1.6:1,c>0.9?1.6:1)}
    // 지구
    {const a=1-sm(-7.4,-6.4,L);if(a>0){const[x,y]=P(EARTH[0],EARTH[1]);const rr=Math.max(1.5,6371*KM*sc);const g=ctx.createRadialGradient(x-rr*0.35,y-rr*0.35,rr*0.1,x,y,rr);
      g.addColorStop(0,'#9fd0ff');g.addColorStop(0.6,'#2f6fc7');g.addColorStop(1,'#0c2450');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rr,0,TAU);ctx.fill();ctx.globalAlpha=1}}
    // 태양과 행성 궤도
    {const a=1-sm(-1.6,-0.4,L);if(a>0){const[x,y]=P(SUN[0],SUN[1]);const rr=Math.max(2.5,6.96e5*KM*sc);const g=ctx.createRadialGradient(x,y,0,x,y,rr*2.4);
      g.addColorStop(0,'rgba(255,240,190,1)');g.addColorStop(0.4,'rgba(255,200,90,0.9)');g.addColorStop(1,'rgba(255,170,60,0)');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rr*2.4,0,TAU);ctx.fill();
      const oa=fade(L,-7.6,-6.8,-2.6,-1.8);if(oa>0){for(const[d,c]of PL){const R=d*AU*sc;if(R<3)continue;ctx.strokeStyle=`rgba(152,160,184,${0.45*oa})`;ctx.beginPath();ctx.arc(x,y,R,0,TAU);ctx.stroke();
        const an=d===1?0:d*2.1;ctx.fillStyle=c;ctx.globalAlpha=a*oa;ctx.beginPath();ctx.arc(x+R*Math.cos(an),y-R*Math.sin(an),3,0,TAU);ctx.fill();ctx.globalAlpha=a}}ctx.globalAlpha=1}}
    // 가까운 별
    {const a=fade(L,-1.4,-0.4,2.4,3.1);if(a>0){for(const[sx,sy,m]of NB){const[x,y]=P(sx,sy);if(x<-5||x>W+5||y<-5||y>H+5)continue;ctx.fillStyle=`rgba(255,248,235,${a*Math.min(1,0.3+m*0.4)})`;ctx.beginPath();ctx.arc(x,y,m,0,TAU);ctx.fill()}
      const[x,y]=P(SUN[0],SUN[1]);ctx.fillStyle=`rgba(243,189,85,${a})`;ctx.beginPath();ctx.arc(x,y,3,0,TAU);ctx.fill()}}
    // 우리은하
    {const a=sm(2.2,3.3,L);if(a>0){ctx.globalCompositeOperation='lighter';const ps=Math.max(1.1,110*sc);
      groups.forEach((idx,gi)=>{ctx.fillStyle=COLS[gi];ctx.globalAlpha=a;for(const i of idx){const[x,y]=P(X[i],Y[i]);if(x<-2||x>W+2||y<-2||y>H+2)continue;ctx.fillRect(x-ps/2,y-ps/2,ps,ps)}});
      ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';const[x,y]=P(SUN[0],SUN[1]);ctx.strokeStyle=`rgba(243,189,85,${a})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,7,0,TAU);ctx.stroke();ctx.lineWidth=1;
      ctx.fillStyle=`rgba(243,189,85,${a})`;ctx.font='13px "IBM Plex Sans KR", sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('태양계',x+11,y-12)}}
    // 설명
    const st_=L<-7.2?['지구','지름 약 12 700 km. 지금 우리가 서 있는 곳입니다.']:L<-1.5?['태양계','태양과 여덟 행성. 가장 바깥 해왕성까지 약 30 AU(0.00015 pc)입니다.']
      :L<2.6?['태양 주변의 별들','가장 가까운 별까지도 약 1.3 pc. 별과 별 사이는 매우 멉니다.']:['우리은하','수천억 개의 별이 모인 원반. 지름 약 30 000 pc입니다.'];
    $('tripTitle').textContent=st_[0];$('tripSub').textContent=st_[1];$('tripScale').textContent=`화면 너비 ${widthText(2*hw)}`;
    if(u<1)raf=requestAnimationFrame(frame);else finish()}
  function size(){const dpr=devicePixelRatio||1;W=ov.clientWidth;H=ov.clientHeight;cv.width=W*dpr;cv.height=H*dpr}
  function finish(){cancelAnimationFrame(raf);ov.classList.add('out');setTimeout(()=>{ov.hidden=true;ov.classList.remove('out')},500);if(done){const f=done;done=null;f()}}
  $('tripSkip').addEventListener('click',finish);
  return{start(cb){done=cb;if(matchMedia('(prefers-reduced-motion: reduce)').matches){finish();return}ov.hidden=false;size();t0=performance.now();raf=requestAnimationFrame(frame)}}
})();
function setSpace(on){$('galPanel').hidden=!on;$('spaceBtn').textContent=on?'지구로 돌아가기':'우주로 나가기';$('spaceBtn').setAttribute('aria-pressed',on);
  if(on){resize();needGal=true;schedule();$('galPanel').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
  else{window.scrollTo({top:0,behavior:'smooth'})}}
$('spaceBtn').addEventListener('click',()=>{if($('galPanel').hidden)trip.start(()=>setSpace(true));else setSpace(false)});
new ResizeObserver(resize).observe(document.querySelector('.lab'));
computeMGH();aimDefault();syncUI();rulerText();resize();redrawAll();
})();
</script>
</body>
